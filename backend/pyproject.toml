[project]
name = "leadsort-backend"
version = "0.1.0"
description = "LeadSort — разбор входящих заявок нейросетью"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "redis>=5.2",
    "tzdata>=2026.5",
]

# Деплой на Vercel: FastAPI-приложение — переменная app в app/main.py
[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends(...) в аргументах — идиома FastAPI
ignore = ["B008"]
